<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName upload.example.com
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/upload

    # 비밀 파일과 앱 폴더는 어떤 경우에도 접근 차단
    <FilesMatch "^(\.env.*|client_secret.*\.json|token\.json|requirements\.txt)$">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "^/var/www/html/upload/(storage|app|\.venv)">
        Require all denied
    </DirectoryMatch>

    # 모든 요청을 FastAPI 앱으로 전달
    ProxyPreserveHost On
    ProxyAddHeaders Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For expr=%{REMOTE_ADDR}
    ProxyTimeout 600
    Timeout 600
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    <Directory /var/www/html/upload>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/upload_error.log
    CustomLog ${APACHE_LOG_DIR}/upload_access.log combined

    SSLCertificateFile /etc/letsencrypt/live/upload.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/upload.example.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>

