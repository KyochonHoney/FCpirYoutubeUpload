<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 - PIR 업로더</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap login">
    <div class="card">
      <h1>관리자 로그인</h1>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <label for="u">아이디</label>
        <input id="u" name="username" type="text" autocomplete="username" autofocus required>
        <label for="p">비밀번호</label>
        <input id="p" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">로그인</button>
      </form>
      <p class="hint" style="margin-top:16px;text-align:center"><a href="/privacy">개인정보처리방침</a> · <a href="/terms">서비스 약관</a></p>
    </div>
  </div>
</body>
</html>
